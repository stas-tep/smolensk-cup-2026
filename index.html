<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Лето 2026 · Технические работы</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a8cff 0%, #0066cc 50%, #004099 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: rgba(255,255,255,0.05);
            border-radius: 44px;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.4), 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            padding: 20px 16px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* ФОНОВЫЕ ЭМОДЗИ */
        .inner-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .inner-bg .emoji-1 { position: absolute; bottom: 12%; right: 6%; font-size: 42px; opacity: 0.15; transform: rotate(-15deg); }
        .inner-bg .emoji-2 { position: absolute; top: 18%; left: 5%; font-size: 38px; opacity: 0.15; transform: rotate(10deg); }
        .inner-bg .emoji-3 { position: absolute; top: 55%; right: 8%; font-size: 36px; opacity: 0.12; transform: rotate(5deg); }
        .inner-bg .emoji-4 { position: absolute; bottom: 25%; left: 6%; font-size: 40px; opacity: 0.12; transform: rotate(-8deg); }

        /* ОБЪЁМНЫЙ ВОСКЛИЦАТЕЛЬНЫЙ ЗНАК */
        .exclamation-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 900px;
        }

        .exclamation {
            font-size: 130px;
            line-height: 1;
            display: block;
            transform: rotateY(-18deg) rotateX(12deg);
            transform-style: preserve-3d;
            filter: drop-shadow(10px 18px 20px rgba(0,0,0,0.55));
            -webkit-text-stroke: 1px rgba(0,0,0,0.1);
        }

        /* СМЕНЯЮЩИЕСЯ ФРАЗЫ */
        .phrase-container {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 60px;
        }

        .phrase {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.6s ease;
            position: absolute;
            white-space: nowrap;
        }

        .phrase.active {
            opacity: 1;
        }

        /* МЕЛКАЯ СТРОЧКА ВНИЗУ */
        .footer-note {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.5px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="inner-bg">
        <div class="emoji-1">🍔</div>
        <div class="emoji-2">🎧</div>
        <div class="emoji-3">💵</div>
        <div class="emoji-4">🎮</div>
    </div>

    <div class="screen">
        <div class="exclamation-wrapper">
            <div class="exclamation">❗</div>
        </div>

        <div class="phrase-container" id="phraseContainer">
            <div class="phrase active">Считаем деньги…</div>
            <div class="phrase">Пишем пост…</div>
            <div class="phrase">Настраиваем призы…</div>
            <div class="phrase">Договариваемся с партнёрами…</div>
            <div class="phrase">Запускаем розыгрыш…</div>
            <div class="phrase">Скоро всё будет готово!</div>
        </div>

        <div class="footer-note">Ведутся технические работы</div>
    </div>
</div>

<script>
    const phrases = document.querySelectorAll('.phrase');
    let currentIndex = 0;
    const totalPhrases = phrases.length;
    const intervalTime = 2500;

    function showNextPhrase() {
        phrases[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % totalPhrases;
        phrases[currentIndex].classList.add('active');
    }

    setInterval(showNextPhrase, intervalTime);
</script>
