<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Анонс · Лето 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 50%, #0a121a 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: rgba(0,0,0,0.3);
            border-radius: 44px;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 10;
            -webkit-overflow-scrolling: touch;
        }

        .phone-frame::-webkit-scrollbar { display: none; }
        .phone-frame { -ms-overflow-style: none; scrollbar-width: none; }

        .screen {
            padding: 20px 16px;
            min-height: 100%;
            position: relative;
            z-index: 2;
            padding-bottom: 40px;
        }

        /* СТИЛЬ ДЛЯ ЗАЦЕНЗУРЕННЫХ БЛОКОВ — СЕРАЯ ПОЛОСА */
        .censored-gray {
            background: #4a4a4a;
            border-radius: 20px;
            color: transparent;
            text-shadow: none;
            display: inline-block;
        }
        .censored-block {
            background: #3a3a3a;
            border-radius: 16px;
            height: 24px;
            width: 120px;
        }
        .censored-date-block {
            background: #4a4a4a;
            border-radius: 20px;
            height: 16px;
            width: 80px;
            display: inline-block;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: transparent;
            margin-bottom: 20px;
        }
        .header-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .dropdown-stages {
            position: relative;
            z-index: 200;
        }
        .dropdown-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,200,80,0.3);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid #333;
            min-width: 200px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: 0.2s;
            z-index: 300;
            pointer-events: auto;
        }
        .dropdown-stages.open .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .stage-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stage-item .stage-name-drop {
            font-weight: 700;
            color: #ccc;
            font-size: 14px;
        }
        .stage-item .stage-date-drop {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }
        .censored-date-small {
            background: #4a4a4a;
            border-radius: 12px;
            height: 14px;
            width: 70px;
            display: inline-block;
        }

        /* КНОПКА УЧАСТВОВАТЬ — ОРИГИНАЛЬНЫЙ СТИЛЬ, НО СЕРАЯ (неактивная) */
        .join-btn {
            background: linear-gradient(95deg, #6b7280, #4b5563);
            border: none;
            border-radius: 50px;
            padding: 8px 24px;
            font-size: 14px;
            font-weight: 800;
            color: #d1d5db;
            cursor: default;
            box-shadow: 0 2px 0 #374151;
            transition: none;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
            z-index: 5;
        }
        .hero-title h1 {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #888, #555);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }
        .year-box {
            display: inline-block;
            margin-top: 5px;
            padding: 6px 18px;
            border: 2px solid #555;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            color: #aaa;
            background: rgba(0,0,0,0.5);
        }

        /* ПЛАШКА АНОНСА (НЕ ТРОГАТЬ) */
        .announce-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 14px 20px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px dashed #ffaa33;
        }
        .announce-badge p {
            color: #ffaa66;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .announce-badge .big-text {
            font-size: 20px;
            font-weight: 800;
            margin-top: 8px;
            color: #ffcc88;
        }

        .stages-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 35px;
        }
        .stage-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .stage-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stage-number {
            font-size: 20px;
            font-weight: 800;
            color: #ccc;
        }
        .stage-date-censored {
            margin-top: 2px;
        }
        .info-btn-censored {
            background: #333;
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: default;
            box-shadow: none;
        }

        .footer-block {
            text-align: center;
            margin-top: 20px;
        }
        .footer-phrase {
            font-size: 24px;
            font-weight: 900;
            color: #777;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .footer-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .footer-cloud {
            background: #222;
            border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;
            padding: 10px 16px;
            text-align: center;
            flex: 1;
            cursor: default;
        }
        .footer-cloud span {
            font-size: 10px;
            font-weight: 600;
            color: #666;
        }
        .footer-cloud .cloud-title {
            font-size: 14px;
            font-weight: 800;
            color: #888;
            margin-top: 4px;
        }
        .footer-note {
            text-align: center;
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            margin-top: 25px;
        }

        /* ДОПОЛНИТЕЛЬНЫЕ СЕРЫЕ БЛОКИ */
        .spacer-censored {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="screen">
        <div class="sticky-header">
            <div class="header-bar">
                <div class="dropdown-stages" id="dropdownStages">
                    <div class="dropdown-btn" id="dropdownBtn">
                        <span>ЭТАПЫ</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="stage-item" data-stage="1">
                            <span class="stage-name-drop">1 ЭТАП</span>
                            <span class="stage-date-drop"><span class="censored-date-small"></span></span>
                        </div>
                        <div class="stage-item" data-stage="2">
                            <span class="stage-name-drop">2 ЭТАП</span>
                            <span class="stage-date-drop"><span class="censored-date-small"></span></span>
                        </div>
                        <div class="stage-item" data-stage="3">
                            <span class="stage-name-drop">3 ЭТАП</span>
                            <span class="stage-date-drop"><span class="censored-date-small"></span></span>
                        </div>
                        <div class="stage-item" data-stage="4">
                            <span class="stage-name-drop">4 ЭТАП</span>
                            <span class="stage-date-drop"><span class="censored-date-small"></span></span>
                        </div>
                        <div class="stage-item" data-stage="5">
                            <span class="stage-name-drop">5 ЭТАП</span>
                            <span class="stage-date-drop"><span class="censored-date-small"></span></span>
                        </div>
                    </div>
                </div>
                <!-- КНОПКА УЧАСТВОВАТЬ — ОРИГИНАЛЬНЫЙ СТИЛЬ, НО СЕРАЯ -->
                <button class="join-btn" id="joinButton">УЧАСТВОВАТЬ</button>
            </div>
        </div>

        <div class="hero-title">
            <h1>Лето</h1>
            <div class="year-box">2026</div>
        </div>

        <!-- ПЛАШКА АНОНСА (НЕ ТРОГАЛИ) -->
        <div class="announce-badge">
            <p>⚡ ОФИЦИАЛЬНЫЙ АНОНС СКОРО ⚡</p>
            <div class="big-text">ДАТЫ И ПРИЗЫ БУДУТ ОБЪЯВЛЕНЫ</div>
            <div style="margin-top: 12px;"><span class="censored-block" style="width: 120px; height: 12px;"></span></div>
        </div>

        <!-- СПИСОК ЭТАПОВ — ДАТЫ ЗАМАЗАНЫ -->
        <div class="stages-list">
            <div class="stage-row">
                <div class="stage-left">
                    <div class="stage-number">1 ЭТАП</div>
                    <div class="stage-date-censored"><span class="censored-date-block"></span></div>
                </div>
                <button class="info-btn-censored">СКОРО</button>
            </div>
            <div class="stage-row">
                <div class="stage-left">
                    <div class="stage-number">2 ЭТАП</div>
                    <div class="stage-date-censored"><span class="censored-date-block"></span></div>
                </div>
                <button class="info-btn-censored">СКОРО</button>
            </div>
            <div class="stage-row">
                <div class="stage-left">
                    <div class="stage-number">3 ЭТАП</div>
                    <div class="stage-date-censored"><span class="censored-date-block"></span></div>
                </div>
                <button class="info-btn-censored">СКОРО</button>
            </div>
            <div class="stage-row">
                <div class="stage-left">
                    <div class="stage-number">4 ЭТАП</div>
                    <div class="stage-date-censored"><span class="censored-date-block"></span></div>
                </div>
                <button class="info-btn-censored">СКОРО</button>
            </div>
            <div class="stage-row">
                <div class="stage-left">
                    <div class="stage-number">5 ЭТАП</div>
                    <div class="stage-date-censored"><span class="censored-date-block"></span></div>
                </div>
                <button class="info-btn-censored">СКОРО</button>
            </div>
        </div>

        <!-- ПРИЗОВОЙ ФОНД И ПОБЕДИТЕЛИ ПОЛНОСТЬЮ УБРАНЫ -->

        <div class="footer-block">
            <div class="footer-phrase">ДО СТАРТА ОСТАЛОСЬ НЕДОЛГО</div>
            <div class="footer-row">
                <div class="footer-cloud">
                    <span>Генеральный партнёр</span>
                    <div class="cloud-title">KIIT3K</div>
                </div>
                <div class="footer-cloud">
                    <span>Правила участия</span>
                    <div class="cloud-title">СКОРО</div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            🔒 Информация засекречена до официального анонса 🔒
        </div>
    </div>
</div>

<script>
    // ДРОПДАУН (чисто визуально)
    const dropdown = document.getElementById('dropdownStages');
    const dropdownBtn = document.getElementById('dropdownBtn');
    if (dropdownBtn) {
        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('open');
        });
    }
    document.addEventListener('click', (e) => {
        if (dropdown && !dropdown.contains(e.target)) {
            dropdown.classList.remove('open');
        }
    });

    // ВСЕ КНОПКИ НЕАКТИВНЫ (только визуал)
    const joinBtn = document.getElementById('joinButton');
    if (joinBtn) {
        joinBtn.addEventListener('click', () => {
            alert('🔒 Регистрация временно закрыта. Следите за анонсом!');
        });
    }
    const infoBtns = document.querySelectorAll('.info-btn-censored');
    infoBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            alert('📅 Информация об этапе появится после официального анонса.');
        });
    });
    const stageItemsDropdown = document.querySelectorAll('.stage-item');
    stageItemsDropdown.forEach(item => {
        item.addEventListener('click', () => {
            alert('⏳ Даты этапов будут объявлены позже.');
        });
    });
    const rulesCloud = document.querySelector('.footer-cloud:last-child');
    if (rulesCloud) {
        rulesCloud.addEventListener('click', () => {
            alert('📜 Правила участия появятся вместе со стартом регистрации.');
        });
    }
</script>
